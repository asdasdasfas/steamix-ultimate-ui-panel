<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="xcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444"/>
      <stop offset="50%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#ff4444"/>
    </linearGradient>
    <linearGradient id="xcGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,68,68,0.4)"/>
      <stop offset="100%" style="stop-color:rgba(255,107,53,0)"/>
    </linearGradient>
  </defs>
  <!-- Background glow -->
  <rect x="0" y="0" width="280" height="80" rx="12" fill="url(#xcGlow)"/>
  <!-- XC logo mark -->
  <rect x="4" y="14" width="52" height="52" rx="8" fill="url(#xcGrad)" opacity="0.15"/>
  <text x="30" y="50" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900" fill="url(#xcGrad)">XC</text>
  <!-- Text -->
  <text x="66" y="32" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="2">Xtream</text>
  <text x="66" y="58" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="700" fill="url(#xcGrad)" letter-spacing="3">CODES</text>
  <!-- Subtitle line -->
  <line x1="66" y1="66" x2="260" y2="66" stroke="url(#xcGrad)" stroke-width="1" opacity="0.4"/>
</svg>
