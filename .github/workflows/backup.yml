name: Auto Backup

on:
  schedule:
    - cron: '*/15 * * * *'  # her 15 dk
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Export from panel
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          EXPORT_PASS: ${{ secrets.EXPORT_PASS }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          echo "PANEL_URL=$PANEL_URL"
          echo "Waiting for panel (up to 3 dk)..."
          for i in $(seq 1 18); do curl -s -o /dev/null -w "%{http_code}\n" "$PANEL_URL/" | grep -q 200 && break; echo "retry $i..."; sleep 10; done
          curl -s -o /dev/null -w "final:%{http_code}\n" "$PANEL_URL/"
          echo "Login..."
          RESP=$(curl -s -X POST "$PANEL_URL/api/login" -H "Content-Type: application/json" -d "{\"username\":\"$ADMIN_USER\",\"password\":\"$ADMIN_PASS\"}")
          echo "Login resp: $RESP"
          TOKEN=$(echo "$RESP" | jq -r .token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then echo "Login response:"; curl -s -X POST "$PANEL_URL/api/login" -H "Content-Type: application/json" -d "{\"username\":\"$ADMIN_USER\",\"password\":\"$ADMIN_PASS\"}"; echo ""; exit 1; fi
          echo "Export..."
          mkdir -p backups
          curl -s -X POST "$PANEL_URL/api/export" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"password\":\"$EXPORT_PASS\"}" -o backups/backup-$(date +%Y%m%d-%H%M).bin
          ls -lh backups/; test -s backups/*.bin || (echo "backup empty"; exit 1)
      - name: Commit backup
        run: |
          git config user.name "backup-bot"
          git config user.email "backup@steamix.local"
          git add backups/
          git diff --cached --quiet || git commit -m "auto backup $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || echo "no changes"
